# LyCodec v2.0 긴급 수정 설정 - Backward Pass 문제 해결
# Backward pass에서 멈추는 문제를 위한 극도로 보수적인 설정

# Random seed for reproducibility
seed: 42

# Data configuration - 더 작은 데이터로 테스트
data:
  data_dir: "dataset/raw/music"
  segment_seconds: 2.5                    # 🔧 5초 → 2.5초로 감소 (메모리 절약)
  samples_per_track: 1                    # 🔧 3 → 1로 감소 (빠른 테스트)
  file_limit: 10                          # 🔧 10개 파일만 사용 (테스트용)

# Model architecture - 더 작은 모델
model:
  latent_dim: 32                          # 🔧 64 → 32로 감소
  base_channels: 32                       # 🔧 64 → 32로 감소  
  n_layers: 3                             # 🔧 6 → 3으로 감소

# Training configuration - 극도로 보수적
training:
  batch_size: 1                           # 최소 배치 크기 유지
  accumulate_grad_batches: 4              # 🔧 16 → 4로 감소 (빠른 gradient step)
  num_workers: 0                          # Multiprocessing 비활성화
  
  learning_rate: 0.001                    # 🔧 더 큰 learning rate로 빠른 수렴
  num_epochs: 10                          # 🔧 테스트용으로 짧게
  
  # 🔧 모든 고급 기능 비활성화
  mixed_precision: false                  # FP16 비활성화
  gradient_checkpointing: false           # 🔧 Gradient checkpointing 비활성화 (메모리 vs 안정성)
  
  checkpoint_dir: "checkpoints_emergency"
  save_every: 5

# Accelerate configuration
accelerate:
  mixed_precision: "no"
  gradient_accumulation_steps: 4          # training.accumulate_grad_batches와 맞춤
  num_processes: 1                        # 🔧 단일 GPU로 테스트

# Audio processing - 단순화
audio:
  sample_rate: 44100
  n_fft: 1024                             # 🔧 2048 → 1024로 감소
  hop_length: 256                         # 🔧 512 → 256으로 감소
  n_mels: 64                              # 🔧 128 → 64로 감소
  
  n_gammatone_filters: 32                 # 🔧 64 → 32로 감소
  psychoacoustic_weight: 0.05             # 🔧 0.1 → 0.05로 감소
  normalize_method: "rms"

# Loss function weights - 단순화
loss:
  magnitude_weight: 1.0
  phase_weight: 0.05                      # 🔧 0.1 → 0.05로 감소
  spectral_weight: 0.3                    # 🔧 0.5 → 0.3으로 감소
  time_weight: 0.2                        # 🔧 0.3 → 0.2로 감소
  latent_weight: 0.005                    # 🔧 0.01 → 0.005로 감소

# Validation - 비활성화
validation:
  val_split: 0                            # 🔧 Validation 완전 비활성화
  val_every: 1000                         # 사실상 비활성화

# Hardware optimization - 극도로 보수적
hardware:
  use_tensor_cores: false                 # 🔧 Tensor Core 비활성화
  cudnn_benchmark: false
  empty_cache_every: 1                    # 🔧 매 배치마다 캐시 정리
  max_memory_fraction: 0.7                # 🔧 더 보수적인 메모리 사용

# Advanced features - 모두 비활성화
advanced:
  use_triton_kernels: false
  progressive_training: false
  perceptual_loss: false                  # 🔧 Perceptual loss 비활성화
  dynamic_loss_scaling: false             # 🔧 Dynamic scaling 비활성화

# Logging - 더 자주 로깅
logging:
  log_level: "DEBUG"                      # 🔧 더 자세한 로깅
  log_every: 1                            # 🔧 매 배치마다 로그
  tensorboard_dir: "logs_emergency"

# WandB - 비활성화
wandb:
  enabled: false                          # 🔧 WandB 완전 비활성화

# Debug settings - 강화된 디버깅
debug:
  log_first_batch_progress: true
  monitor_gpu_memory: true
  profile_slow_operations: true           # 🔧 느린 연산 프로파일링 활성화
  max_batch_processing_time: 60           # 🔧 1분 타임아웃
  emergency_stop_on_timeout: true         # 🔧 타임아웃 시 긴급 정지

# Emergency settings - 긴급 상황 대응
emergency:
  minimal_model: true                     # 최소 모델 사용
  skip_validation: true                   # Validation 건너뛰기
  frequent_memory_cleanup: true           # 자주 메모리 정리
  conservative_memory: true               # 보수적 메모리 사용
  single_gpu_only: true                   # 단일 GPU만 사용
  simple_loss_only: true                  # 간단한 loss만 사용