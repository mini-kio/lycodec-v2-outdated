# LyCodec v2.0 Log-Mel + Phase Architecture - V100×4 16GB Production Configuration
# NEW ARCHITECTURE: Waveform → STFT → Mel filterbank → log_mel (128 bin) + phase preservation
# All critical issues resolved: RNG isolation, DDP compatibility, mel-scale processing

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  data_dir: "dataset/raw/music"
  segment_seconds: 5.0                    # Full production length
  samples_per_track: 3                    # Full production sampling
  file_limit: null                        # Use all available audio files

# Model architecture configuration - LOG-MEL + PHASE (Production)
model:
  latent_dim: 64                          # Full production latent dimension
  base_channels: 64                       # Full production channel count
  n_layers: 6                             # Full production layer depth

# Training configuration - PRODUCTION for V100×4 16GB with Log-Mel processing
training:
  # Batch configuration optimized for production training
  batch_size: 8                           # Production batch size per GPU (4 * 4 GPUs = 16 total)
  accumulate_grad_batches: 1              # Full production gradient accumulation
  num_workers: 4                          # Production multi-threading enabled
  
  # Optimization settings
  learning_rate: 0.0001                   # Production learning rate
  num_epochs: 1000                        # Full production training epochs
  
  # Precision and stability settings
  mixed_precision: true                   # Enable FP16 as requested
  gradient_checkpointing: true            # Memory efficiency for 16GB cards
  
  # Checkpointing
  checkpoint_dir: "checkpoints_logmel"
  save_every: 50                          # Save checkpoint every N epochs

  # Accelerate configuration - FIXED for DDP compatibility with log-mel (4 GPUs)
accelerate:
  # These are handled by accelerate config, but documented here
  mixed_precision: "fp16"                 # Enable FP16 as requested
  gradient_accumulation_steps: 8          # Must match training.accumulate_grad_batches
  num_processes: 4                        # 4 GPUs for V100×4
  
  # CRITICAL: DDP configuration fixes applied automatically
  # - find_unused_parameters: false (as requested)
  # - broadcast_buffers: true

# Audio processing configuration - MEL-SCALE OPTIMIZED
audio:
  sample_rate: 44100                      # Audio sample rate
  n_fft: 2048                             # FFT size for STFT
  hop_length: 512                         # STFT hop length (f10 compression in time)
  n_mels: 128                             # NEW: Number of mel bands (critical for log-mel architecture)
  f_min: 20                               # Minimum frequency for mel filterbank
  f_max: 22050                            # Maximum frequency for mel filterbank
  
  # Psychoacoustic settings - OPTIMIZED for mel-scale
  n_gammatone_filters: 64                 # Gammatone filterbank size for psychoacoustic masking
  psychoacoustic_weight: 0.1              # Weight for psychoacoustic loss in mel domain
  
  # Audio normalization
  normalize_method: "rms"                 # RMS normalization

# Compression settings (f10c10 = 100x compression) - MAINTAINED in log-mel domain
compression:
  frequency_compression: 10               # Frequency axis compression factor (mel-scale)
  time_compression: 10                    # Time axis compression factor
  total_compression: 100                  # Total compression ratio
  mel_compression_factor: 8               # NEW: Mel-scale specific compression (~128 mel bins vs ~1025 STFT bins)

# Loss function weights - BALANCED for log-mel + phase architecture
loss:
  log_mel_weight: 1.0                     # NEW: Primary log-mel reconstruction loss
  mel_weight: 0.3                         # NEW: Linear mel constraint loss
  phase_weight: 0.5                       # Enhanced phase alignment loss with magnitude weighting
  spectral_weight: 0.7                    # Multi-scale spectral loss adapted for mel-scale
  time_proxy_weight: 0.2                  # NEW: Time-domain proxy loss using mel energy
  latent_weight: 0.15                     # Enhanced latent regularization (increased for gradient flow)
  perceptual_weight: 0.1                  # NEW: Perceptual consistency loss in mel-domain
  
# Validation settings
validation:
  val_split: 0.1                          # 10% validation split
  val_every: 10                           # Validate every N epochs

# Inference optimization for <16GB VRAM with log-mel processing
inference:
  half_precision: true                    # FP16 for inference efficiency
  max_chunk_length: 220500                # 5 seconds max chunk
  overlap_length: 4410                    # 0.1 second overlap
  cpu_fallback: true                      # Fallback for low VRAM
  mel_processing_batch_size: 32           # NEW: Batch size for mel-scale processing

# Logging and monitoring
logging:
  log_level: "INFO"
  log_every: 100                          # Log every N batches
  tensorboard_dir: "logs_logmel"

# Hardware optimization - V100×4 16GB PRODUCTION with mel-scale processing
hardware:
  # V100 specific optimizations
  use_tensor_cores: true                  # Enable for production performance
  cudnn_benchmark: true                   # Enable for production performance
  
  # Memory management - PRODUCTION optimized for 16GB
  empty_cache_every: 50                   # Less frequent cache clearing for performance
  max_memory_fraction: 0.85               # Higher memory usage for production (85% of 16GB)
  
  # Stability settings
  torch_compile: false                    # Disabled for stability
  channels_last: false                    # Standard memory format
  
# Advanced features - STABILITY FOCUSED with log-mel optimizations
advanced:
  # CRITICAL: All advanced features disabled for maximum stability
  use_triton_kernels: false               # Triton completely disabled
  progressive_training: false             # Standard training approach
  perceptual_loss: true                   # Enhanced perceptual loss in mel-domain
  dynamic_loss_scaling: false             # Disabled for FP32 training
  mel_domain_augmentation: false          # NEW: Mel-scale data augmentation (disabled for stability)

# WandB experiment tracking
wandb:
  project: "lycodec-v2-logmel"
  entity: "your-team"                     # Replace with your WandB username/team
  enabled: true                           # Enable experiment tracking
  tags: ["lycodec", "v2.0", "log-mel", "phase", "v100x4", "16gb"]
  notes: "LyCodec v2.0 with log-mel + phase architecture, psychoacoustic masking, and critical fixes for production training"

# CRITICAL FIXES APPLIED (documented for reference)
critical_fixes:
  rng_isolation: true                     # Isolated RNG states per process
  ddp_unused_parameters: true             # find_unused_parameters=False in DDP
  tensor_dimension_handling: true         # Enhanced STFT/ISTFT dimension handling  
  gradient_flow_enhancement: true         # All parameters guaranteed to receive gradients
  memory_optimization: true               # Conservative memory settings for 16GB
  error_handling: true                    # Comprehensive error handling and fallbacks
  log_mel_phase_architecture: true       # NEW: Log-mel + phase processing pipeline
  psychoacoustic_masking: true            # NEW: Psychoacoustic masking curve weighting
  
# Performance optimizations - VERIFIED WORKING with log-mel
optimizations:
  vectorized_stft: true                   # Batch STFT computation
  mel_domain_loss: true                   # NEW: Direct mel-scale loss computation
  distributed_psychoacoustic: true        # Distributed psychoacoustic processing
  gradient_checkpointing: true            # Memory-efficient backpropagation
  phase_continuity: true                  # NEW: Phase continuity preservation
  
# Debug settings - Production monitoring (CRITICAL FIX for dimension mismatch)
debug:
  log_first_batch_progress: false         # Disabled for production
  monitor_gpu_memory: true                # Monitor V100 memory usage
  profile_slow_operations: false          # Disabled for performance
  verify_ddp_compatibility: true          # Verify DDP setup on startup
  mel_processing_validation: true         # NEW: Validate mel-scale processing
  phase_preservation_check: true          # NEW: Check phase preservation quality
  stft_dimension_verification: true       # CRITICAL: Verify STFT/mel filterbank dimension consistency
  force_n_fft_consistency: true           # CRITICAL: Enforce consistent n_fft usage across pipeline

# NEW: Mel-scale architecture specific settings
mel_architecture:
  # Architecture details
  version: "2.0"
  type: "log_mel_phase"
  description: "Waveform → STFT → Mel filterbank → log_mel (128 bin) + phase preservation"
  
  # Mel filterbank configuration
  mel_filterbank:
    n_mels: 128                           # Number of mel bands
    f_min: 20                             # Minimum frequency (Hz)
    f_max: 22050                          # Maximum frequency (Hz)
    norm: null                            # No normalization
    htk: false                            # Use slaney mel scale
  
  # Phase processing
  phase_processing:
    enabled: true                         # Enable phase preservation
    magnitude_weighting: true             # Weight phase loss by magnitude
    phase_unwrapping: false               # Disabled for stability
    phase_continuity: true                # Ensure phase continuity across chunks
  
  # Psychoacoustic masking
  psychoacoustic:
    enabled: true                         # Enable psychoacoustic masking
    gammatone_filters: 64                 # Number of gammatone filters
    masking_threshold_db: -60             # Masking threshold in dB
    frequency_dependent_weighting: true   # Use frequency-dependent weights
    temporal_masking: false               # Disabled for simplicity
  
  # Compression strategy
  compression_strategy:
    frequency_method: "mel_scale"         # Use mel-scale for frequency compression
    time_method: "conv_stride"            # Use convolution stride for time compression
    target_ratio: 100                     # Target 100x compression (f10c10)
    preserve_phase: true                  # Maintain phase information
    
  # Quality settings
  quality:
    target_snr_db: 30                     # Target signal-to-noise ratio
    perceptual_quality: "high"            # High perceptual quality mode
    streaming_optimized: true             # Optimize for streaming applications
    low_latency_mode: false               # Disabled for quality

# Model architecture details for log-mel + phase
model_architecture:
  # Encoder configuration
  encoder:
    input_channels: 128                   # Mel bins
    output_latent_dim: 32                 # Latent space dimensions
    residual_blocks: 5                    # Number of residual blocks
    psychoacoustic_blocks: 5              # Blocks with psychoacoustic attention
    frequency_downsampling_stages: 3      # f10 compression stages
    time_downsampling_stages: 2           # c10 compression stages
    
  # Decoder configuration  
  decoder:
    input_latent_dim: 32                  # Latent space dimensions
    output_channels: 128                  # Mel bins (reconstruction)
    residual_blocks: 5                    # Number of residual blocks
    frequency_upsampling_stages: 3        # f10 reconstruction stages
    time_upsampling_stages: 2             # c10 reconstruction stages
    phase_reconstruction: true            # Enable phase reconstruction head
    
  # Shared components
  shared:
    activation: "gelu"                    # Activation function
    normalization: "rms_norm_2d"          # Normalization method
    attention_type: "linear"              # Linear attention for efficiency
    dropout_rate: 0.1                     # Dropout for regularization
    use_gradient_checkpointing: true      # Memory efficiency

# Streaming configuration for real-time applications
streaming:
  # Latency settings
  target_latency_ms: 100                  # Target latency in milliseconds
  chunk_size_samples: 4410               # Chunk size (0.1 second at 44.1kHz)
  overlap_ratio: 0.5                      # Overlap ratio for smooth transitions
  
  # Buffer management
  input_buffer_size: 8                    # Input queue size
  output_buffer_size: 8                   # Output queue size
  max_processing_time_ms: 50              # Maximum processing time per chunk
  
  # Quality vs latency trade-offs
  quality_mode: "balanced"                # balanced, low_latency, high_quality
  adaptive_quality: true                  # Adapt quality based on processing load
  psychoacoustic_streaming: true          # Enable psychoacoustic processing in streaming