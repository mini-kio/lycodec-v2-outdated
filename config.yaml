# LyCodec v2.0 Training Configuration
# Optimized for V100×4 16GB setup

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  data_dir: "dataset/raw/music"           # Path to raw audio files
  segment_seconds: 5.0                    # Length of each training segment
  samples_per_track: 3                    # Number of samples per audio file
  file_limit: null                        # Maximum number of audio files (null = use all files)

# Model architecture configuration  
model:
  latent_dim: 64                          # Latent representation channels
  base_channels: 64                       # Base number of channels
  n_layers: 6                             # Number of encoder/decoder layers

# Training configuration
training:
  # Batch and memory settings (optimized for 16GB VRAM)
  batch_size: 1                           # Reduced batch size to prevent OOM
  accumulate_grad_batches: 16             # Increased accumulation to maintain effective batch size
  num_workers: 0                          # Disable multiprocessing to test for deadlock
  
  # Optimization
  learning_rate: 0.0001                    # Peak learning rate (1e-4)
  num_epochs: 1000                        # Total training epochs
  
  # Memory optimization
  mixed_precision: false                  # Disable AMP to test for stability issues
  gradient_checkpointing: true            # Enable gradient checkpointing to save memory
  
  # Checkpointing
  checkpoint_dir: "checkpoints"           # Directory to save checkpoints
  save_every: 50                          # Save checkpoint every N epochs

# Accelerate configuration (set via 'accelerate config' command)
accelerate:
  # These settings are managed by Accelerate's config system
  # Run 'accelerate config' to set up distributed training
  mixed_precision: "no"                   # Disable mixed precision to test stability
  gradient_accumulation_steps: 4          # Should match training.accumulate_grad_batches
  num_processes: 4                        # Number of GPUs to use

# Audio processing configuration
audio:
  sample_rate: 44100                      # Audio sample rate
  n_fft: 2048                             # FFT size
  hop_length: 512                         # STFT hop length (f10 compression in time)
  n_mels: 128                             # Number of mel bands
  
  # Psychoacoustic settings
  n_gammatone_filters: 64                 # Gammatone filterbank size
  psychoacoustic_weight: 0.1              # Weight for psychoacoustic loss
  
  # Audio normalization method
  normalize_method: "rms"                 # "rms", "peak", or "lufs"

# Compression settings (f10c10 = 100x compression)
compression:
  frequency_compression: 10               # Frequency axis compression factor
  time_compression: 10                    # Time axis compression factor
  total_compression: 100                  # Total compression ratio

# Loss function weights
loss:
  magnitude_weight: 1.0                   # Magnitude spectrum loss
  phase_weight: 0.1                       # Phase loss
  spectral_weight: 0.5                    # Multi-scale spectral loss  
  time_weight: 0.3                        # Time-domain loss
  latent_weight: 0.01                     # Latent regularization
  
# Validation settings
validation:
  val_split: 0.1                          # Validation split ratio
  val_every: 10                           # Validate every N epochs

# Inference optimization (for <10GB VRAM)
inference:
  half_precision: true                    # Use FP16 for inference
  max_chunk_length: 220500                # Maximum chunk length (5 seconds)
  overlap_length: 4410                    # Chunk overlap (0.1 seconds)
  cpu_fallback: true                      # Fallback to CPU if low VRAM

# Logging and monitoring
logging:
  log_level: "INFO"                       # Logging level
  log_every: 200                          # Log every N batches (reduced from 100)
  tensorboard_dir: "logs"                 # TensorBoard logs directory
  
# Hardware optimization (V100×4 16GB optimized)
hardware:
  # V100 specific optimizations
  use_tensor_cores: true                  # Enable Tensor Core usage for mixed precision
  cudnn_benchmark: false                  # Disable for reproducibility, enable for speed after debugging
  
  # Memory management for 16GB cards (more aggressive)
  empty_cache_every: 5                    # Clear CUDA cache every N batches (more frequent)
  max_memory_fraction: 0.85               # More conservative for multi-process training
  
  # V100 optimization flags
  torch_compile: false                    # PyTorch 2.0 compile (experimental)
  channels_last: false                    # Memory format optimization
  
# Advanced features
advanced:
  # Triton kernel optimizations (v2.0 optimized)
  use_triton_kernels: true                # Enable custom Triton kernels for 2-3x speedup
  
  # Progressive training
  progressive_training: false             # Start with shorter sequences
  
  # Perceptual optimization
  perceptual_loss: true                   # Enable perceptual loss
  
  # Dynamic loss scaling
  dynamic_loss_scaling: true              # Adaptive loss scaling for stability

# WandB experiment tracking (v2.0)
wandb:
  project: "lycodec-v2-training"          # Updated project name for v2
  entity: "your-team"                     # Your WandB team/username
  enabled: true                           # Enable WandB logging
  tags: ["lycodec", "v2.0", "f10c10"]    # Tags for experiment organization