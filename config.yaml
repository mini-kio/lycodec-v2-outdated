# LyCodec v2.0 V100×4 최적화 설정 - GPU 활용률 극대화
# 예상 성능 향상: 4-5배, VRAM 활용률: 80-90%

# Random seed for reproducibility
seed: 42

# Data configuration - STEP 4: 배치/시퀀스 재조정
data:
  data_dir: "dataset/raw/music"
  segment_seconds: 4.0                    # 6.0 → 4.0 (STEP 4: STFT·Mel 길이 ×²⁄₃)
  samples_per_track: 5                    # 증가 - 더 많은 데이터 다양성
  file_limit: null                        # Use all available audio files

# Model architecture configuration - 대폭 강화된 모델
model:
  latent_dim: 64                         # 64 → 128 (2배 증가)
  base_channels: 64                      # 64 → 128 (2배 증가) 
  n_layers: 8                            # 6 → 8 (더 깊은 네트워크)

# Training configuration - V100×4 최적화 + STEP 3: DataLoader I/O 튜닝
training:
  # 배치 설정 - GPU 메모리 활용률 극대화
  batch_size: 4                          # 20 → 16 (STEP 4: 배치 재조정)
  accumulate_grad_batches: 2              # 2 → 1 (STEP 4: grad-accum 최적화)
  
  # STEP 3: DataLoader I/O 튜닝 - Disk wait ↓, context-switch ↓
  num_workers: 12                          # 12 → 4 (코어 수 ≈ 워커)
  persistent_workers: true                # 워커 프로세스 유지로 context-switch 감소
  prefetch_factor: 4                      # 4개 배치 미리 로드
  pin_memory: true                        # STEP 5: pinned memory for faster GPU transfer
  
  # 최적화 설정
  learning_rate: 0.0002                   # 큰 배치에 맞춰 증가
  num_epochs: 500                         # 1000 → 500 (빠른 수렴 예상)
  
  # 정밀도 및 안정성 설정
  mixed_precision: true                   # FP16 유지
  gradient_checkpointing: false           # 큰 배치에서는 비활성화로 속도 우선
  
  # 체크포인팅
  checkpoint_dir: "checkpoints"
  save_every: 25                          # 더 자주 저장

# Accelerate configuration - V100×4 최적화
accelerate:
  mixed_precision: "fp16"                 
  gradient_accumulation_steps: 2          
  num_processes: 4                        

# Audio processing configuration - 텐서 코어 최적화
audio:
  sample_rate: 44100                      
  n_fft: 2048                            
  hop_length: 512                        
  n_mels: 128                            # 8의 배수 유지 (텐서 코어 최적화)
  f_min: 20                              
  f_max: 22050                           
  
  # Psychoacoustic settings - 강화
  n_gammatone_filters: 64                 
  psychoacoustic_weight: 0.15             # 0.1 → 0.15 (더 강한 psychoacoustic loss)
  
  # Audio normalization
  normalize_method: "rms"                 

# Compression settings - 유지
compression:
  frequency_compression: 10               
  time_compression: 10                    
  total_compression: 100                  
  mel_compression_factor: 8               

# Loss function weights - 최적화
loss:
  log_mel_weight: 1.0                     
  mel_weight: 0.4                         # 0.3 → 0.4 (강화)
  phase_weight: 0.6                       # 0.5 → 0.6 (강화)
  spectral_weight: 0.8                    # 0.7 → 0.8 (강화)
  time_proxy_weight: 0.25                 # 0.2 → 0.25 (강화)
  latent_weight: 0.2                      # 0.15 → 0.2 (강화된 정규화)
  perceptual_weight: 0.15                 # 0.1 → 0.15 (강화)

# Validation settings
validation:
  val_split: 0.1                          
  val_every: 5                            # 10 → 5 (더 자주 검증)

# Inference optimization - 강화된 모델에 맞춰 조정
inference:
  half_precision: true                    
  max_chunk_length: 264600                # 6초에 맞춰 증가
  overlap_length: 4410                    
  cpu_fallback: true                      
  mel_processing_batch_size: 40           # 32 → 40 (증가)

# Logging and monitoring
logging:
  log_level: "INFO"
  log_every: 50                           # 100 → 50 (더 자주 로깅)
  tensorboard_dir: "logs_optimized"

# Hardware optimization - V100×4 최대 활용
hardware:
  # V100 specific optimizations
  use_tensor_cores: true                  
  cudnn_benchmark: true                   
  
  # Memory management - 적극적 활용
  empty_cache_every: 100                  # 50 → 100 (캐시 클리어 빈도 감소)
  max_memory_fraction: 0.95               # 0.85 → 0.95 (95% 활용)
  
  # Performance settings
  torch_compile: false                    # DISABLED due to dynamo compatibility issues
  channels_last: true                     # false → true (메모리 효율성)
  
# Advanced features - 성능 최적화
advanced:
  use_triton_kernels: false               # 안정성 유지
  progressive_training: false             
  perceptual_loss: true                   
  dynamic_loss_scaling: true              # false → true (FP16 최적화)
  mel_domain_augmentation: true           # false → true (데이터 증강)

# WandB experiment tracking
wandb:
  project: "lycodec-v2-optimized"
  entity: "your-team"                     
  enabled: true                           
  tags: ["lycodec", "v2.0", "optimized", "v100x4", "high-performance"]
  notes: "V100×4 최적화 버전 - 4-5배 성능 향상 목표, 95% VRAM 활용"

# Performance optimizations - 새로운 최적화
optimizations:
  vectorized_stft: true                   
  mel_domain_loss: true                   
  distributed_psychoacoustic: true        
  gradient_checkpointing: false           # 큰 배치에서는 비활성화
  phase_continuity: true                  
  tensor_core_alignment: true             # 새로운 최적화
  memory_efficient_attention: true        # 새로운 최적화
  
# Debug settings - 성능 모니터링 강화
debug:
  log_first_batch_progress: true          # 첫 배치 진행상황 로깅
  monitor_gpu_memory: true                
  profile_slow_operations: false          
  verify_ddp_compatibility: true          
  mel_processing_validation: true         
  phase_preservation_check: true          
  stft_dimension_verification: true       
  force_n_fft_consistency: true           
  performance_profiling: true             # 새로운 프로파일링

# 새로운 섹션: V100 특화 최적화
v100_optimizations:
  # 텐서 코어 최적화
  tensor_core_enabled: true
  optimal_batch_sizes: [16, 20, 24, 32]  # V100에 최적화된 배치 크기들
  
  # 메모리 최적화  
  memory_pool_enabled: true
  memory_pool_size_mb: 14000              # 14GB 메모리 풀
  
  # 커널 최적화
  fused_operations: true
  custom_kernels: false                   # 안정성 우선
  
  # 성능 모니터링
  target_gpu_utilization: 0.90           # 90% 목표
  target_memory_utilization: 0.85        # 85% 목표
  performance_alert_threshold: 0.75      # 75% 아래로 떨어지면 알림

# 예상 성능 지표
expected_performance:
  batch_processing_time_sec: 1.0         # 3.5s → 1.0s 예상
  gpu_utilization_percent: 90            # 25% → 90% 예상  
  memory_utilization_percent: 85         # 25% → 85% 예상
  throughput_improvement_factor: 4.5     # 4.5배 향상 예상
  epoch_time_reduction_percent: 75       # 75% 시간 단축 예상  