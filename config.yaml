# LyCodec v2.0 안정화 설정 - 그래디언트 문제 및 CUDA 오류 해결
# 성능보다 안정성 우선, 로그 스팸 최소화

# Random seed for reproducibility
seed: 42

# Data configuration - 안정성 우선
data:
  data_dir: "dataset/raw/music"
  segment_seconds: 4.0
  samples_per_track: 3                    # 메모리 절약
  file_limit: 100                         # 테스트용 제한

# Model architecture configuration - 단순화
model:
  latent_dim: 64                          # 안정적인 크기
  base_channels: 64                       # 메모리 절약
  n_layers: 4                            # 단순화

# Training configuration - 안정성 최우선
training:
  # 배치 설정 - 안전한 크기
  batch_size: 2                           # 작은 배치로 안정성 확보
  accumulate_grad_batches: 8              # 효과적 배치 16
  
  # DataLoader 안정화 - CUDA 오류 방지
  num_workers: 0                          # 단일 프로세스로 CUDA 오류 방지
  persistent_workers: false               # 워커 비활성화
  prefetch_factor: null                   # 워커 없으므로 null
  pin_memory: true                        # GPU 전송 최적화는 유지
  
  # 최적화 설정
  learning_rate: 0.0002
  num_epochs: 100                         # 테스트용 단축
  
  # 정밀도 및 안정성 설정
  mixed_precision: true                   # FP16으로 메모리 절약
  gradient_checkpointing: true
  
  # 체크포인팅
  checkpoint_dir: "checkpoints_stable"
  save_every: 10                          # 자주 저장

# Accelerate configuration - 단일 GPU 안정화
accelerate:
  mixed_precision: "fp16"
  gradient_accumulation_steps: 8
  num_processes: 1                        # 단일 GPU로 안정화

# Audio processing configuration
audio:
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  f_min: 20
  f_max: 22050
  
  # Psychoacoustic settings - 단순화
  n_gammatone_filters: 32                 # 절반으로 축소
  psychoacoustic_weight: 0.1
  
  # Audio normalization
  normalize_method: "rms"

# Compression settings
compression:
  frequency_compression: 10
  time_compression: 10
  total_compression: 100
  mel_compression_factor: 8

# Loss function weights - 안정화
loss:
  log_mel_weight: 1.0
  mel_weight: 0.3
  phase_weight: 0.4
  spectral_weight: 0.5
  time_proxy_weight: 0.2
  latent_weight: 0.1
  perceptual_weight: 0.1

# Validation settings
validation:
  val_split: 0.1
  val_every: 5

# Inference optimization
inference:
  half_precision: true
  max_chunk_length: 220500
  overlap_length: 4410
  cpu_fallback: true
  mel_processing_batch_size: 16

# Logging and monitoring - 스팸 최소화
logging:
  log_level: "WARNING"                    # INFO에서 WARNING으로 상향
  log_every: 100                          # 로그 빈도 감소
  tensorboard_dir: "logs_stable"

# Hardware optimization - 안정성 우선
hardware:
  use_tensor_cores: false                 # 호환성 문제 방지
  cudnn_benchmark: false                  # 재현성 우선
  
  # Memory management - 보수적 설정
  empty_cache_every: 10                   # 자주 캐시 정리
  max_memory_fraction: 0.7                # 메모리 여유 확보
  
  # Performance settings - 안정성 우선
  torch_compile: false                    # 비활성화
  channels_last: false                    # 안정성 우선

# Advanced features - 최소화
advanced:
  use_triton_kernels: false
  progressive_training: false
  perceptual_loss: true
  dynamic_loss_scaling: false
  mel_domain_augmentation: false

# WandB experiment tracking - 단순화
wandb:
  project: "lycodec-stable-test"
  entity: null
  enabled: true
  tags: ["lycodec", "stable", "test"]
  notes: "안정화 테스트 - 그래디언트 및 CUDA 오류 해결"

# Performance optimizations - 안정성 우선
optimizations:
  vectorized_stft: false                  # 안정성 우선
  mel_domain_loss: true
  distributed_psychoacoustic: false       # 단일 GPU
  gradient_checkpointing: true
  phase_continuity: true
  tensor_core_alignment: false            # 호환성 문제 방지
  memory_efficient_attention: false       # 안정성 우선

# Debug settings - 필수만 유지
debug:
  log_first_batch_progress: false         # 로그 스팸 방지
  monitor_gpu_memory: true
  profile_slow_operations: false
  verify_ddp_compatibility: false          # 단일 GPU
  mel_processing_validation: false
  phase_preservation_check: false
  stft_dimension_verification: false
  force_n_fft_consistency: true
  performance_profiling: false
  
  # 안정성 체크만 유지
  cuda_error_handling: true
  memory_leak_detection: true
  tensor_device_verification: false       # 로그 스팸 방지

# 단일 GPU 최적화
single_gpu_optimizations:
  tensor_core_enabled: false
  optimal_batch_sizes: [1, 2, 4]
  
  # 메모리 최적화
  memory_pool_enabled: false              # 단순화
  memory_pool_size_mb: 4000
  
  # 커널 최적화 비활성화
  fused_operations: false
  custom_kernels: false
  
  # 성능 모니터링 - 보수적
  target_gpu_utilization: 0.6
  target_memory_utilization: 0.6
  performance_alert_threshold: 0.5

# 예상 성능 지표 - 현실적 목표
expected_performance:
  batch_processing_time_sec: 3.0          # 안정성 우선
  gpu_utilization_percent: 60
  memory_utilization_percent: 60
  throughput_improvement_factor: 1.5      # 현실적 목표
  epoch_time_reduction_percent: 30